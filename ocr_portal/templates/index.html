<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VisionRead — OCR Portal</title>
<style>
  :root {
    --bg: #0f1720; --panel: #17212c; --border: #2a3a4a;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4a90d9;
    --accent2: #2c4c6b; --ok: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .wrap { width: 100%; max-width: 760px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }
  .drop {
    border: 2px dashed var(--border); border-radius: 8px; padding: 32px;
    text-align: center; cursor: pointer; transition: 0.15s;
  }
  .drop:hover, .drop.drag { border-color: var(--accent); background: #132030; }
  .drop input { display: none; }
  #preview { max-width: 100%; max-height: 260px; border-radius: 6px; margin-top: 14px; display: none; }
  button {
    background: var(--accent); color: white; border: none; padding: 10px 22px;
    border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 14px;
  }
  button:disabled { background: #3a4a5a; cursor: not-allowed; }
  .result { font-family: "SF Mono", Consolas, monospace; font-size: 14px; white-space: pre-wrap;
    background: #0b1119; border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-top: 14px; }
  .result .text-val { color: var(--ok); font-size: 20px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .hist-item {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-text { color: var(--ok); font-weight: 600; }
  .hist-file { color: var(--muted); }
  .badge { font-size: 11px; color: var(--muted); }
  .spinner { display:none; margin-top:14px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <h1>VisionRead</h1>
  <div class="sub">VLM-based text extraction — plates, signs, and plaques</div>

  <div class="wrap">
    <div class="card">
      <div class="drop" id="drop">
        <div id="dropLabel">Drop an image here, or click to choose one</div>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview">
      </div>
      <div class="row">
        <button id="extractBtn" disabled>Extract Text</button>
        <span class="badge" id="fileBadge"></span>
      </div>
      <div class="spinner" id="spinner">Running inference…</div>
      <div class="result" id="result" style="display:none"></div>
    </div>

    <div class="card">
      <div class="row"><strong>Recent extractions</strong><span class="badge">this session</span></div>
      <div id="history" style="margin-top:10px; color: var(--muted); font-size:13px;">No runs yet.</div>
    </div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const extractBtn = document.getElementById('extractBtn');
const resultBox = document.getElementById('result');
const spinner = document.getElementById('spinner');
const fileBadge = document.getElementById('fileBadge');
const dropLabel = document.getElementById('dropLabel');
let currentFile = null;

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) setFile(e.target.files[0]); });

function setFile(file) {
  currentFile = file;
  const reader = new FileReader();
  reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; dropLabel.style.display='none'; };
  reader.readAsDataURL(file);
  extractBtn.disabled = false;
  fileBadge.textContent = file.name;
  resultBox.style.display = 'none';
}

extractBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  extractBtn.disabled = true;
  spinner.style.display = 'block';
  resultBox.style.display = 'none';

  const form = new FormData();
  form.append('image', currentFile);
  try {
    const res = await fetch('/extract', { method: 'POST', body: form });
    const data = await res.json();
    spinner.style.display = 'none';
    extractBtn.disabled = false;
    if (data.error) {
      resultBox.innerHTML = `<span style="color:#e06">Error: ${data.error}</span>`;
    } else {
      const confColor = data.confidence === 'high' ? 'var(--ok)' : '#e0a83c';
      resultBox.innerHTML = `<div class="text-val">${escapeHtml(data.text)}</div>
        <div style="color:${confColor};margin-top:6px;font-size:13px;">confidence: ${data.confidence} ${data.agreement ? '(cross-check agreed)' : '(cross-check differed: ' + escapeHtml(data.cross_check) + ')'}</div>
        <div style="color:var(--muted);margin-top:4px;font-size:12px;">${data.time_s}s · normalized: ${escapeHtml(data.normalized)}</div>`;
    }
    resultBox.style.display = 'block';
    loadHistory();
  } catch (err) {
    spinner.style.display = 'none';
    extractBtn.disabled = false;
    resultBox.innerHTML = `<span style="color:#e06">Request failed: ${err}</span>`;
    resultBox.style.display = 'block';
  }
});

async function loadHistory() {
  const res = await fetch('/history');
  const items = await res.json();
  const el = document.getElementById('history');
  if (!items.length) { el.textContent = 'No runs yet.'; return; }
  el.innerHTML = items.map(i =>
    `<div class="hist-item"><span class="hist-file">${escapeHtml(i.filename)}</span><span class="hist-text">${escapeHtml(i.text)}</span></div>`
  ).join('');
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
loadHistory();
</script>
</body>
</html>
